<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JCSC (Jazz Chord and Scale Calculator)</title>
<style>
    /* === Base Layout (Full Screen, No Window Scroll) === */
    :root {
        --bg-body: #f4f4f4;
        --bg-container: #fff;
        --text-main: #333;
        --border-color: #ccc;
        --header-bg: #fff;
        --th-bg: #f0f0f0;
        --th-text: #333;
        --tr-even: #f9f9f9;
        --tr-hover: #f0f0f0;
        --tr-selected: #e3f2fd;
        --key-white: #fff;
        --key-black: #333;
        --chord-bg: #b3e5fc;
        --chord-border: #81d4fa;
        --btn-bg: #eee;
        --btn-text: #555;
    }

    /* Dark Mode Variables */
    body.dark-mode {
        --bg-body: #121212;
        --bg-container: #1e1e1e;
        --text-main: #e0e0e0;
        --border-color: #444;
        --header-bg: #1e1e1e;
        --th-bg: #2d2d2d;
        --th-text: #e0e0e0;
        --tr-even: #252525;
        --tr-hover: #333;
        --tr-selected: #0d47a1; /* Dark Blue */
        --key-white: #ddd; /* Slightly dimmed */
        --key-black: #111;
        --chord-bg: #01579b; /* Darker Blue for highlights */
        --chord-border: #0277bd;
        --btn-bg: #333;
        --btn-text: #ccc;
    }

    body { 
        font-family: 'Segoe UI', Helvetica, Arial, sans-serif; 
        background: var(--bg-body); 
        margin: 0; 
        padding: 0; 
        color: var(--text-main); 
        height: 100vh; 
        display: flex;
        flex-direction: column;
        overflow: hidden;
        transition: background 0.3s, color 0.3s;
    }

    /* === Header Area === */
    header {
        background: var(--header-bg);
        padding: 5px 15px;
        border-bottom: 1px solid var(--border-color);
        display: flex;
        justify-content: space-between;
        align-items: center;
        flex-shrink: 0;
    }
    .license { font-size: 11px; color: #888; font-weight: bold; }
    h1 { margin: 0; font-size: 16px; color: var(--text-main); }
    
    .header-controls { display: flex; gap: 10px; }

    /* === Keyboard Area === */
    .keyboard-section {
        background: var(--bg-container);
        padding: 10px 0;
        border-bottom: 1px solid var(--border-color);
        flex-shrink: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
    }

    .keyboard-container { 
        overflow-x: auto; 
        display: flex; 
        justify-content: center;
        width: 100%;
    }

    .keyboard { display: flex; position: relative; height: 100px; padding-top: 5px; width: max-content; }
    
    .key { 
        border: 1px solid #999; 
        border-radius: 0 0 3px 3px; 
        position: relative; 
        z-index: 1; 
        display: flex;
        justify-content: center; 
    }
    .key.white { width: 32px; height: 95px; background: var(--key-white); }
    .key.black { width: 22px; height: 60px; background: var(--key-black); margin-left: -11px; margin-right: -11px; z-index: 2; border-radius: 0 0 2px 2px; }
    
    /* Colors */
    .key.white.chord-bg { background: var(--chord-bg) !important; } 
    .key.black.chord-bg { background: var(--chord-bg) !important; border-color: var(--chord-border); }

    .key-label { position: absolute; bottom: 2px; width: 100%; text-align: center; font-size: 9px; color: #aaa; pointer-events: none; }
    .key.black .key-label { display: none; }

    /* Dots */
    .dot {
        position: absolute;
        width: 10px; height: 10px;
        border-radius: 50%;
        bottom: 15px; 
        z-index: 5;
        border: 1px solid rgba(255,255,255,0.9);
    }
    .key.black .dot { bottom: 8px; }

    .dot.root   { background: #d50000; transform: scale(1.2); }
    .dot.guide  { background: #ef5350; }
    .dot.avoid  { background: #ff9800; }
    .dot.scale  { background: #ffcdd2; }
    
    /* Dark Mode Adjustments for Dots */
    body.dark-mode .dot.scale { background: #e57373; } 

    /* Legend */
    .legend { margin-top: 5px; font-size: 11px; color: var(--text-main); display: flex; gap: 15px; opacity: 0.8; }
    .legend-item { display: flex; align-items: center; gap: 4px; }
    .l-box { width: 10px; height: 10px; border: 1px solid #ccc; display: inline-block; }
    .l-bg-chord { background: var(--chord-bg); }
    .l-circle { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
    .l-root  { background: #d50000; }
    .l-guide { background: #ef5350; }
    .l-avoid { background: #ff9800; }
    .l-scale { background: #ffcdd2; }
    body.dark-mode .l-scale { background: #e57373; }

    /* === Table Area === */
    .main-content {
        flex-grow: 1;
        overflow: hidden;
        padding: 10px;
        display: flex;
        flex-direction: column;
    }

    .table-wrapper { 
        border: 1px solid var(--border-color); 
        background: var(--bg-container);
        overflow: auto; 
        height: 100%;
    }

    table { 
        width: 100%; 
        border-collapse: collapse; 
        font-size: 12px; 
    }
    
    th, td { 
        padding: 4px 6px; 
        text-align: left; 
        border-bottom: 1px solid var(--border-color);
        white-space: nowrap;
        color: var(--text-main);
    }
    
    th { 
        background: var(--th-bg); 
        color: var(--th-text); 
        position: sticky; 
        top: 0; 
        z-index: 10; 
        font-weight: 600;
        text-align: center;
        border-bottom: 2px solid var(--border-color);
    }
    
    tr:nth-child(even) { background: var(--tr-even); }
    tr:hover { background: var(--tr-hover); }
    tr.selected-row { background: var(--tr-selected) !important; }
    
    /* Inputs */
    td input { 
        width: 100%; 
        border: none; 
        background: transparent; 
        font-weight: bold; 
        color: var(--text-main); 
        font-size: 12px;
        font-family: inherit;
    }
    td input:focus { outline: 2px solid #86b7fe; background: var(--bg-container); }
    .inp-key { width: 30px; color: #0056b3; text-align: center; }
    body.dark-mode .inp-key { color: #64b5f6; } /* Light blue for dark mode */
    .inp-chord { width: 60px; text-align: center; }

    .mono-col {
        font-family: 'Consolas', 'Monaco', 'Courier New', monospace;
        font-size: 12px;
        white-space: pre;
    }
    
    /* Buttons */
    .btn-action {
        width: 20px; height: 20px;
        border: 1px solid var(--border-color);
        background: var(--btn-bg);
        color: var(--btn-text);
        font-size: 12px;
        line-height: 1;
        cursor: pointer;
        padding: 0;
        border-radius: 3px;
        margin: 0 1px;
    }
    .btn-add:hover { background: #dff0d8; border-color: #d6e9c6; color: #3c763d; }
    body.dark-mode .btn-add:hover { background: #1b5e20; border-color: #2e7d32; color: #a5d6a7; }
    
    .btn-del:hover { background: #f2dede; border-color: #ebccd1; color: #a94442; }
    body.dark-mode .btn-del:hover { background: #b71c1c; border-color: #c62828; color: #ef9a9a; }

    .btn-std {
        font-size: 11px; padding: 4px 10px; cursor: pointer;
        background: var(--btn-bg); color: var(--btn-text);
        border: 1px solid var(--border-color); border-radius: 3px;
    }
    .btn-std:hover { opacity: 0.8; }

</style>
</head>
<body>

<header>
    <div class="license">(c) 2025 GoodRelax. MIT License.</div>
    <h1>JCSC (Jazz Chord and Scale Calculator)</h1>
    <div class="header-controls">
        <button class="btn-std" onclick="app.toggleDarkMode()" title="Toggle Dark Mode">🌙</button>
        <button class="btn-std" onclick="app.recalcAll()">Recalculate</button>
    </div>
</header>

<div class="keyboard-section">
    <div class="keyboard-container">
        <div id="keyboard" class="keyboard"></div>
    </div>
    <div class="legend">
        <div class="legend-item"><span class="l-box l-bg-chord"></span> Chord Tone</div>
        <div class="legend-item"><span class="l-circle l-root"></span> Root</div>
        <div class="legend-item"><span class="l-circle l-guide"></span> Guide</div>
        <div class="legend-item"><span class="l-circle l-avoid"></span> Avoid</div>
        <div class="legend-item"><span class="l-circle l-scale"></span> Scale</div>
    </div>
</div>

<div class="main-content">
    <div class="table-wrapper">
        <table id="mainTable">
            <thead>
                <tr>
                    <th style="width: 25px;">#</th>
                    <th style="width: 40px;">Key</th>
                    <th style="width: 70px;">Chord</th>
                    <th style="width: 50px;">Deg</th>
                    <th style="width: 40px;">Func</th>
                    <th style="width: 100px;">Scale Name</th>
                    <th>Chord Tones</th>
                    <th>Scale Notes</th>
                    <th style="width: 60px;">Act</th>
                </tr>
            </thead>
            <tbody>
                </tbody>
        </table>
    </div>
</div>

// === Logic Engine ===
class TheoryEngine {
    constructor() {
        this.noteLookup = {};
        if(DB.notes) {
            DB.notes.forEach(n => {
                if(!n.BaseDegree || !n.SemitonePosition) return;
                const key = `${n.BaseDegree}-${n.SemitonePosition}`;
                const current = this.noteLookup[key];
                if (!current || Math.abs(parseInt(n.AccidentalValue || 0)) < Math.abs(parseInt(current.AccidentalValue || 0))) {
                    this.noteLookup[key] = n;
                }
            });
        }
        this.intervals = {};
        if(DB.intervals) DB.intervals.forEach(i => this.intervals[i.IntervalID] = i);
        this.chords = {};
        if(DB.chords) DB.chords.forEach(c => this.chords[c.ChordSymbol] = c);
        this.scales = {};
        if(DB.scales) DB.scales.forEach(s => this.scales[s.ScaleName] = s);
    }

    parseNote(noteStr) {
        if (!noteStr) return null;
        noteStr = noteStr.trim();
        const match = noteStr.match(/^([A-G])(b+|#+|x)?$/);
        if (!match) return null;
        const exact = DB.notes.find(n => n.NoteName === noteStr);
        if (exact) return exact;
        return null;
    }

    splitChord(input) {
        if (!input) return { root: null, quality: null };
        input = input.trim();
        const match = input.match(/^([A-G](?:b+|#+|x)?)(.*)$/);
        if (!match) return { root: null, quality: null };
        return { root: match[1], quality: match[2] };
    }

    getNoteFromInterval(rootNote, intervalId) {
        const interval = this.intervals[intervalId];
        if (!interval || !rootNote) return { name: "?", semi: 0 };
        const rBase = parseInt(rootNote.BaseDegree);
        const rSemi = parseInt(rootNote.SemitonePosition);
        const dDeg = parseInt(interval.DeltaDegree);
        const dSemi = parseInt(interval.DeltaSemitone);
        const newBase = (rBase + dDeg) % 7;
        const newSemi = (rSemi + dSemi + 12) % 12; 
        let match = DB.notes.find(n => 
            parseInt(n.BaseDegree) === newBase && 
            parseInt(n.SemitonePosition) === newSemi
        );
        if (!match) match = DB.notes.find(n => parseInt(n.SemitonePosition) === newSemi);
        return { name: match ? match.NoteName : "?", semi: newSemi };
    }

    getInterval(note1, note2) {
        const dDeg = (parseInt(note2.BaseDegree) - parseInt(note1.BaseDegree) + 7) % 7;
        const dSemi = (parseInt(note2.SemitonePosition) - parseInt(note1.SemitonePosition) + 12) % 12;
        const match = DB.intervals.find(i => 
            parseInt(i.DeltaDegree) === dDeg && 
            parseInt(i.DeltaSemitone) === dSemi
        );
        return match ? match.IntervalID : null;
    }

    formatNoteList(notes) {
        return notes.map(n => n.padEnd(6, ' ')).join('');
    }

    analyze(keyStr, chordInput) {
        const res = {
            input: chordInput,
            isValid: false,
            roman: "-",
            func: "-",
            scaleName: "-",
            chordTonesDisplay: "",
            scaleTonesDisplay: "",
            keyboardMap: {} 
        };

        let keyRootStr = "C";
        let keyType = "Major";
        if (keyStr) {
            keyStr = keyStr.trim();
            if (keyStr.endsWith("m")) {
                keyType = "Minor";
                keyRootStr = keyStr.substring(0, keyStr.length - 1);
            } else {
                keyRootStr = keyStr;
            }
        }

        const keyRoot = this.parseNote(keyRootStr);
        const parts = this.splitChord(chordInput);
        const chordRoot = this.parseNote(parts.root);

        if (!keyRoot || !chordRoot) return res;
        res.isValid = true;

        const rootIntervalId = this.getInterval(keyRoot, chordRoot);
        if (!rootIntervalId) { res.roman = "Err:Int"; return res; }

        const rule = DB.rules.find(r => 
            r.KeyType === keyType && 
            r.DegreeIntervalID === rootIntervalId && 
            r.ChordSymbol === parts.quality
        );

        if (!rule) {
            res.roman = `${rootIntervalId}`;
            res.scaleName = "(No Rule)";
            return res;
        }

        res.roman = rule.DegreeIntervalID + (rule.HarmonicFunction ? ` (${rule.HarmonicFunction})` : "");
        res.func = rule.HarmonicFunction || "";
        res.scaleName = rule.ScaleName;

        const scaleDef = this.scales[rule.ScaleName];
        const chordDef = this.chords[parts.quality];
        if (!scaleDef) return res;

        const mapIntervals = (strList) => {
            if (!strList) return [];
            return String(strList).split(',').map(s => s.trim()).filter(s=>s).map(intId => {
                const n = this.getNoteFromInterval(chordRoot, intId);
                return { ...n, interval: intId };
            });
        };

        const sTones = mapIntervals(scaleDef.IntervalsStructure);
        const cTones = chordDef ? mapIntervals(chordDef.IntervalsStructure) : [];
        const gIntervals = chordDef ? (String(chordDef.GuideToneIntervals || "").split(',').map(s=>s.trim())) : [];
        const aIntervals = String(scaleDef.AvoidNoteIntervals || "").split(',').map(s=>s.trim());
        
        const kb = {};
        cTones.forEach(t => {
            if(!kb[t.semi]) kb[t.semi] = { isChord: false, dotType: null };
            kb[t.semi].isChord = true;
        });
        sTones.forEach(t => {
            if(!kb[t.semi]) kb[t.semi] = { isChord: false, dotType: null };
            let type = 'scale'; 
            if (aIntervals.includes(t.interval)) type = 'avoid';
            else if (gIntervals.includes(t.interval)) type = 'guide';
            if (t.interval === 'P1') type = 'root'; 

            const priorities = { 'root': 4, 'avoid': 3, 'guide': 2, 'scale': 1, null: 0 };
            if (priorities[type] > priorities[kb[t.semi].dotType]) {
                kb[t.semi].dotType = type;
            }
        });
        res.keyboardMap = kb;

        res.chordTonesDisplay = this.formatNoteList(cTones.map(t => t.name));
        
        const scaleToneNames = sTones.map(t => {
            let name = t.name;
            if (aIntervals.includes(t.interval)) return `(${name})`;
            if (gIntervals.includes(t.interval)) return `${name}'`;
            return name;
        });
        res.scaleTonesDisplay = this.formatNoteList(scaleToneNames);

        return res;
    }
}

// === APP UI ===
const engine = new TheoryEngine();

const app = {
    rows: [
        { key: "Ebm", chord: "Ebm" },
        { key: "Ebm", chord: "Bbm7" },
        { key: "Gb",  chord: "BM7" },
        { key: "Gb",  chord: "Abm6" },
        { key: "Gb",  chord: "Bbm7" },
        { key: "Gb",  chord: "Ebm7" },
        { key: "Gb",  chord: "Abm7" },
        { key: "Gb",  chord: "Db7" },
        { key: "Gb",  chord: "GbM7" },
        { key: "Ebm", chord: "Fm7b5" },
        { key: "Ebm", chord: "Bb7b9" }
    ],

    init() {
        this.renderTable();
        this.setupKeyboardUI();
    },

    toggleDarkMode() {
        document.body.classList.toggle('dark-mode');
    },

    insertRow(index) {
        const refRow = this.rows[index];
        this.rows.splice(index + 1, 0, { key: refRow.key, chord: "" });
        this.renderTable();
    },

    deleteRow(index) {
        if(this.rows.length <= 1) {
            this.rows[0].chord = ""; 
        } else {
            this.rows.splice(index, 1);
        }
        this.renderTable();
    },

    updateRow(index, field, value) {
        this.rows[index][field] = value;
        this.recalcAll();
    },

    recalcAll() {
        this.renderTable();
    },

    renderTable() {
        const tbody = document.querySelector('#mainTable tbody');
        tbody.innerHTML = '';

        this.rows.forEach((row, i) => {
            const analysis = engine.analyze(row.key, row.chord);
            
            const tr = document.createElement('tr');
            tr.onclick = () => this.highlightRow(i, analysis);
            
            // NOTE: Changed oninput to onchange
            const actions = `
                <button class="btn-action btn-add" onclick="event.stopPropagation(); app.insertRow(${i})">+</button>
                <button class="btn-action btn-del" onclick="event.stopPropagation(); app.deleteRow(${i})">-</button>
            `;

            tr.innerHTML = `
                <td>${i + 1}</td>
                <td><input class="inp-key" value="${row.key}" onchange="app.updateRow(${i}, 'key', this.value)"></td>
                <td><input class="inp-chord" value="${row.chord}" onchange="app.updateRow(${i}, 'chord', this.value)"></td>
                <td>${analysis.roman}</td>
                <td>${analysis.func}</td>
                <td>${analysis.scaleName}</td>
                <td class="mono-col">${analysis.chordTonesDisplay}</td>
                <td class="mono-col">${analysis.scaleTonesDisplay}</td>
                <td style="text-align:center;">${actions}</td>
            `;
            tbody.appendChild(tr);
        });
    },

    highlightRow(index, analysis) {
        const rows = document.querySelectorAll('#mainTable tbody tr');
        rows.forEach(r => r.classList.remove('selected-row'));
        if (rows[index]) rows[index].classList.add('selected-row');
        this.updateKeyboard(analysis.keyboardMap);
    },

    setupKeyboardUI() {
        const kb = document.getElementById('keyboard');
        let html = '';
        const notes = ['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];
        const isBlack = [0, 1, 0, 1, 0, 0, 1, 0, 1, 0, 1, 0];
        for(let oct=0; oct<3; oct++) {
            for(let i=0; i<12; i++) {
                const type = isBlack[i] ? 'black' : 'white';
                html += `<div class="key ${type}" data-semi="${i}">
                            <div class="key-label">${notes[i]}</div>
                         </div>`;
            }
        }
        html += `<div class="key white" data-semi="0"><div class="key-label">C</div></div>`;
        kb.innerHTML = html;
    },

    updateKeyboard(map) {
        const keys = document.querySelectorAll('.key');
        keys.forEach(k => {
            k.classList.remove('chord-bg');
            const oldDot = k.querySelector('.dot');
            if(oldDot) oldDot.remove();
            
            const semi = parseInt(k.getAttribute('data-semi'));
            if (map && map[semi]) {
                const data = map[semi];
                if (data.isChord) k.classList.add('chord-bg');
                if (data.dotType) {
                    const dot = document.createElement('div');
                    dot.className = `dot ${data.dotType}`;
                    k.appendChild(dot);
                }
            }
        });
    }
};

app.init();
</script>
