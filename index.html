<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>iPadで○×ゲーム</title>
    <style>
        /* スタイルの設定 */
        body {
            font-family: "Hiragino Kaku Gothic ProN", sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            background-color: #f0f0f0;
        }

        h1 {
            color: #333;
            margin-bottom: 10px;
        }

        #status {
            font-size: 1.5rem;
            margin-bottom: 20px;
            font-weight: bold;
            color: #555;
            height: 1.5rem; /* 高さを固定してガタつきを防ぐ */
        }

        .board {
            display: grid;
            grid-template-columns: repeat(3, 100px);
            grid-template-rows: repeat(3, 100px);
            gap: 10px;
        }

        .cell {
            width: 100px;
            height: 100px;
            background-color: white;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 3rem;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            user-select: none; /* テキスト選択を防ぐ */
            -webkit-tap-highlight-color: transparent; /* タップ時のハイライトを消す */
        }

        .cell.x { color: #ff4757; } /* ×の色 */
        .cell.o { color: #2ed573; } /* ○の色 */

        button {
            margin-top: 30px;
            padding: 15px 30px;
            font-size: 1.2rem;
            background-color: #3742fa;
            color: white;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0,0,0,0.2);
        }

        button:active {
            transform: scale(0.98);
        }
    </style>
</head>
<body>

    <h1>○×ゲーム</h1>
    <div id="status">プレイヤー「○」の番です</div>
    
    <div class="board" id="board">
        <div class="cell" data-index="0"></div>
        <div class="cell" data-index="1"></div>
        <div class="cell" data-index="2"></div>
        <div class="cell" data-index="3"></div>
        <div class="cell" data-index="4"></div>
        <div class="cell" data-index="5"></div>
        <div class="cell" data-index="6"></div>
        <div class="cell" data-index="7"></div>
        <div class="cell" data-index="8"></div>
    </div>

    <button onclick="resetGame()">もう一度あそぶ</button>

    <script>
        // JavaScriptのロジック
        let currentPlayer = "o"; // 最初は○から
        let gameActive = true;
        let gameState = ["", "", "", "", "", "", "", "", ""];

        const statusDisplay = document.getElementById('status');
        const cells = document.querySelectorAll('.cell');

        // 勝ちパターンの定義
        const winningConditions = [
            [0, 1, 2], [3, 4, 5], [6, 7, 8], // 横
            [0, 3, 6], [1, 4, 7], [2, 5, 8], // 縦
            [0, 4, 8], [2, 4, 6]             // 斜め
        ];

        // セルがクリックされた時の処理
        cells.forEach(cell => {
            cell.addEventListener('click', handleCellClick);
        });

        function handleCellClick(e) {
            const clickedCell = e.target;
            const clickedCellIndex = parseInt(clickedCell.getAttribute('data-index'));

            // すでに埋まっているか、ゲーム終了なら何もしない
            if (gameState[clickedCellIndex] !== "" || !gameActive) {
                return;
            }

            handleCellPlayed(clickedCell, clickedCellIndex);
            handleResultValidation();
        }

        function handleCellPlayed(clickedCell, clickedCellIndex) {
            gameState[clickedCellIndex] = currentPlayer;
            clickedCell.innerText = currentPlayer === "o" ? "○" : "×";
            clickedCell.classList.add(currentPlayer);
        }

        function handleResultValidation() {
            let roundWon = false;

            // 勝ちパターンをチェック
            for (let i = 0; i <= 7; i++) {
                const winCondition = winningConditions[i];
                let a = gameState[winCondition[0]];
                let b = gameState[winCondition[1]];
                let c = gameState[winCondition[2]];

                if (a === '' || b === '' || c === '') {
                    continue;
                }
                if (a === b && b === c) {
                    roundWon = true;
                    break;
                }
            }

            if (roundWon) {
                statusDisplay.innerText = `プレイヤー「${currentPlayer === "o" ? "○" : "×"}」の勝ち！`;
                gameActive = false;
                return;
            }

            // 引き分けチェック
            let roundDraw = !gameState.includes("");
            if (roundDraw) {
                statusDisplay.innerText = "引き分けです！";
                gameActive = false;
                return;
            }

            // プレイヤー交代
            currentPlayer = currentPlayer === "o" ? "x" : "o";
            statusDisplay.innerText = `プレイヤー「${currentPlayer === "o" ? "○" : "×"}」の番です`;
        }

        function resetGame() {
            gameActive = true;
            currentPlayer = "o";
            gameState = ["", "", "", "", "", "", "", "", ""];
            statusDisplay.innerText = `プレイヤー「○」の番です`;
            document.querySelectorAll('.cell').forEach(cell => {
                cell.innerText = "";
                cell.classList.remove('x', 'o');
            });
        }
    </script>
</body>
</html>
