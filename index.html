<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>iPad Web MIDI PoC</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, sans-serif; padding: 20px; background-color: #f4f4f4; }
        h1 { font-size: 1.2rem; color: #333; }
        .card { background: white; padding: 15px; border-radius: 10px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); margin-bottom: 20px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        select, button { width: 100%; font-size: 1rem; padding: 10px; margin-bottom: 10px; border-radius: 8px; border: 1px solid #ccc; }
        button { background-color: #007aff; color: white; border: none; font-weight: bold; cursor: pointer; }
        button:active { background-color: #005bb5; }
        button:disabled { background-color: #ccc; }
        #log { height: 200px; overflow-y: scroll; background: #222; color: #0f0; font-family: monospace; padding: 10px; border-radius: 8px; font-size: 0.8rem; }
        .status { margin-bottom: 10px; font-size: 0.9rem; color: #666; }
    </style>
</head>
<body>

    <h1>iPad MIDI PoC</h1>

    <div id="status" class="status">MIDIアクセスを待機中...</div>

    <div class="card">
        <label for="midiInput">MIDI 入力 (受信)</label>
        <select id="midiInput"><option value="">デバイスを選択...</option></select>

        <label for="midiOutput">MIDI 出力 (送信)</label>
        <select id="midiOutput"><option value="">デバイスを選択...</option></select>
    </div>

    <div class="card">
        <button id="playBtn" disabled>C4を5秒間鳴らす</button>
    </div>

    <div class="card">
        <label>受信データログ</label>
        <div id="log">Waiting for MIDI input...</div>
    </div>

    <script>
        let midiAccess = null;
        let activeOutput = null;

        const statusDiv = document.getElementById('status');
        const inputSelect = document.getElementById('midiInput');
        const outputSelect = document.getElementById('midiOutput');
        const playBtn = document.getElementById('playBtn');
        const logDiv = document.getElementById('log');

        // MIDIアクセスのリクエスト
        if (navigator.requestMIDIAccess) {
            navigator.requestMIDIAccess({ sysex: false })
                .then(onMIDISuccess, onMIDIFailure);
        } else {
            statusDiv.textContent = "このブラウザはWeb MIDI APIをサポートしていません。";
            statusDiv.style.color = "red";
        }

        function onMIDISuccess(access) {
            midiAccess = access;
            statusDiv.textContent = "MIDIアクセス成功。デバイスを選択してください。";
            updateDeviceList();

            // 接続状態が変わったらリストを更新
            midiAccess.onstatechange = updateDeviceList;
        }

        function onMIDIFailure() {
            statusDiv.textContent = "MIDIアクセスに失敗しました。";
            statusDiv.style.color = "red";
        }

        // デバイスリストの更新
        function updateDeviceList() {
            // 入力ポート
            const inputs = midiAccess.inputs;
            inputSelect.innerHTML = '<option value="">デバイスを選択...</option>';
            inputs.forEach(input => {
                const option = document.createElement('option');
                option.value = input.id;
                option.text = input.name;
                inputSelect.appendChild(option);
                // 入力イベントのリスナー登録
                input.onmidimessage = handleMIDIMessage;
            });

            // 出力ポート
            const outputs = midiAccess.outputs;
            outputSelect.innerHTML = '<option value="">デバイスを選択...</option>';
            outputs.forEach(output => {
                const option = document.createElement('option');
                option.value = output.id;
                option.text = output.name;
                outputSelect.appendChild(option);
            });
            
            // ボタン有効化判定
            playBtn.disabled = outputSelect.options.length <= 1;
        }

        // 3. MIDI入力データの表示処理
        function handleMIDIMessage(event) {
            // 選択されたデバイスからの入力のみ表示したい場合はここでIDチェックを行う
            if (inputSelect.value && event.target.id !== inputSelect.value) return;

            const [status, data1, data2] = event.data;
            const command = status >> 4;
            const channel = status & 0xf;
            
            // ログの整形
            const msg = `[CH:${channel + 1}] CMD:${command.toString(16)} Note:${data1} Vel:${data2}`;
            const line = document.createElement('div');
            line.textContent = msg;
            logDiv.prepend(line); // 新しいものを上に
        }

        // 2. C4の音を5秒鳴らす処理
        playBtn.addEventListener('click', () => {
            const outputId = outputSelect.value;
            if (!outputId) {
                alert("出力デバイスを選択してください");
                return;
            }

            const output = midiAccess.outputs.get(outputId);
            if (output) {
                // MIDI Note On: 0x90 (144), Note: 60 (C4), Velocity: 100
                output.send([0x90, 60, 100]);
                logDiv.prepend(document.createTextNode("OUTPUT: Note ON (C4)\n"));

                // 5秒後にNote Off
                setTimeout(() => {
                    // MIDI Note Off: 0x80 (128), Note: 60, Velocity: 0
                    output.send([0x80, 60, 0]);
                    logDiv.prepend(document.createTextNode("OUTPUT: Note OFF (C4)\n"));
                }, 5000);
            }
        });

        // 出力デバイス変更時の処理
        outputSelect.addEventListener('change', () => {
             playBtn.disabled = !outputSelect.value;
        });

    </script>
</body>
</html>
